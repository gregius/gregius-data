name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug"]
type: bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The unexpected behavior, including the exact error message as text.
      placeholder: "e.g. The RAG block returns a 500 when the search query is empty."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps to reach the bug from a known state.
      placeholder: |
        1. Activate gregius-data v1.0.2
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: "e.g. 7.1"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "e.g. 8.3"
    validations:
      required: false
